name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the minimum version in go.mod and the latest release
        go: [ '1.21', 'stable' ]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Kernel
      run: uname -r

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

    - name: Test (epoll backend)
      run: URINGNET_BACKEND=epoll go test -race -count=1 ./...

    - name: Build examples
      run: go build ./example/...

    - name: Benchmark suite
      working-directory: bench
      run: go vet ./...

    - name: Upload coverage to Codecov
      if: matrix.go == 'stable'
      uses: codecov/codecov-action@v4
      with:
        files: coverage.out
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  staticcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: 'stable'
    - uses: dominikh/staticcheck-action@v1
      with:
        version: latest
        install-go: false
