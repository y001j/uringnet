  <text x="168" y="133" font-size="11.5" fill="#1f2328" text-anchor="end">&#9312; submit requests (SQEs)</text>
  <text x="168" y="299" font-size="11.5" fill="#1f2328" text-anchor="end">&#9313; kernel consumes them</text>
  <text x="556" y="299" font-size="11.5" fill="#1f2328" text-anchor="start">&#9314; kernel posts results (CQEs)</text>
  <text x="556" y="133" font-size="11.5" fill="#1f2328" text-anchor="start">&#9315; app reaps results</text>
  <text x="380" y="192" font-size="11.5" fill="#1f2328" text-anchor="start">io_uring_enter</text>
  <text x="380" y="210" font-size="11.5" fill="#57606a" text-anchor="start">submits a batch,</text>
  <text x="380" y="226" font-size="11.5" fill="#57606a" text-anchor="start">waits for a batch</text>
