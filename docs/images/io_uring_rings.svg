  <text x="548" y="215" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">CQ</text>
  <text x="616" y="190" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">Completion queue</text>
  <text x="616" y="212" font-size="11.5" fill="#57606a" text-anchor="start">tail: kernel writes</text>
